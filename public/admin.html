<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roggers Wi-Fi Admin</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, button { padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #28a745; color: white; border: none; cursor: pointer; }
    button.btn-pause { background: #ffc107; color: #000; }
    button.btn-delete { background: #dc3545; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #28a745; color: white; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .Active { background: #d4edda; color: #155724; }
    .Paused { background: #fff3cd; color: #856404; }
    .Expired { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>Roggers Wi-Fi Management Dashboard</h2>

  <div class="card">
    <h3>Manual Member Registration</h3>
    <input type="text" id="regName" placeholder="One Name (e.g., Lawi)">
    <input type="text" id="regPhone" placeholder="Phone Number (e.g., 0823645278)">
    <input type="number" id="regAmount" placeholder="Amount Paid (e.g., 200)" value="200">
    <input type="number" id="regDays" placeholder="Days (e.g., 30)" value="30">
    <button onclick="registerUser()">Register Member</button>
  </div>

  <div class="card">
    <h3>All Registered Members</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Code</th>
          <th>Status</th>
          <th>Start Date</th>
          <th>Expiry Date</th>
          <th>Days Left</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="user-table"></tbody>
    </table>
  </div>

  <script>
    let authHeader = '';

    function authenticate() {
      const username = prompt("Enter Admin Username:");
      const password = prompt("Enter Admin Password:");
      authHeader = 'Basic ' + btoa(username + ':' + password);
      loadUsers();
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', { headers: { 'Authorization': authHeader } });
        if (res.status === 401) {
          alert("Invalid Username or Password!");
          return authenticate();
        }
        const users = await res.json();
        const tbody = document.getElementById('user-table');
        tbody.innerHTML = '';

        if (!Array.isArray(users) || users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8">No registered members found.</td></tr>';
          return;
        }

        users.forEach(u => {
          tbody.innerHTML += `
            <tr>
              <td>${u.user_name || 'N/A'}</td>
              <td>${u.phone_number}</td>
              <td>${u.mpesa_code}</td>
              <td><span class="badge ${u.status}">${u.status}</span></td>
              <td>${new Date(u.start_date).toLocaleDateString()}</td>
              <td>${new Date(u.expiry_date).toLocaleString()}</td>
              <td><strong>${u.days_left} Days</strong></td>
              <td>
                <button class="btn-pause" onclick="togglePause(${u.id})">${u.is_paused ? 'Resume' : 'Pause'}</button>
                <button class="btn-delete" onclick="deleteUser(${u.id})">Delete / Refund</button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function registerUser() {
      const name = document.getElementById('regName').value;
      const phone = document.getElementById('regPhone').value;
      const amount = document.getElementById('regAmount').value;
      const days = document.getElementById('regDays').value;

      if (!name || !phone) {
        alert("Please fill in both Name and Phone Number.");
        return;
      }

      const res = await fetch('/api/admin/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ name, phone, amount, days })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById('regName').value = '';
        document.getElementById('regPhone').value = '';
        loadUsers();
      } else {
        alert("Error: " + (data.error || data.message));
      }
    }

    async function togglePause(id) {
      await fetch('/api/admin/toggle-pause', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': authHeader },
        body: JSON.stringify({ id })
      });
      loadUsers();
    }

    async function deleteUser(id) {
      if (confirm("Are you sure you want to delete this user?")) {
        await fetch(`/api/admin/delete/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': authHeader }
        });
        loadUsers();
      }
    }

    authenticate();
  </script>
</body>
</html>
