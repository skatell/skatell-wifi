<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roggers Wi-Fi Admin</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, button { padding: 8px; margin: 2px; border: 1px solid #ccc; border-radius: 4px; }
    input.tbl-input { width: 110px; font-size: 13px; }
    button { background: #28a745; color: white; border: none; cursor: pointer; }
    button.btn-save { background: #007bff; }
    button.btn-pause { background: #ffc107; color: #000; }
    button.btn-delete { background: #dc3545; }
    button.btn-logout { background: #6c757d; float: right; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #28a745; color: white; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .Active { background: #d4edda; color: #155724; }
    .Paused { background: #fff3cd; color: #856404; }
    .Expired { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div style="overflow: hidden; margin-bottom: 15px;">
    <h2 style="float: left; margin: 0;">Roggers Wi-Fi Management Dashboard</h2>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h3>Manual Member Registration</h3>
    <input type="text" id="regName" placeholder="One Name (e.g., Lawi)">
    <input type="text" id="regPhone" placeholder="Phone Number (e.g., 0823645278)">
    <input type="number" id="regAmount" placeholder="Amount Paid (e.g., 200)" value="200">
    <input type="number" id="regDays" placeholder="Days (e.g., 30)" value="30">
    <button onclick="registerUser()">Register Member</button>
  </div>

  <div class="card">
    <h3>All Registered Members</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Amount (KES)</th>
          <th>Code</th>
          <th>Status</th>
          <th>Start Date</th>
          <th>Days Left</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="user-table"></tbody>
    </table>
  </div>

  <script>
    const adminToken = localStorage.getItem('adminToken');

    // Redirect to login page if token does not exist
    if (!adminToken) {
      window.location.href = '/login';
    }

    function logout() {
      localStorage.removeItem('adminToken');
      window.location.href = '/login';
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', { 
          headers: { 'x-admin-token': adminToken } 
        });

        if (res.status === 401) {
          alert("Session expired. Please log in again.");
          logout();
          return;
        }

        const users = await res.json();
        const tbody = document.getElementById('user-table');
        tbody.innerHTML = '';

        if (!Array.isArray(users) || users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8">No registered members found.</td></tr>';
          return;
        }

        users.forEach(u => {
          tbody.innerHTML += `
            <tr>
              <td><input type="text" class="tbl-input" id="name-${u.id}" value="${u.user_name || ''}"></td>
              <td><input type="text" class="tbl-input" id="phone-${u.id}" value="${u.phone_number || ''}"></td>
              <td><input type="number" class="tbl-input" style="width: 70px;" id="amount-${u.id}" value="${u.amount_paid || 0}"></td>
              <td><input type="text" class="tbl-input" style="width: 90px;" id="code-${u.id}" value="${u.mpesa_code || ''}"></td>
              <td><span class="badge ${u.status}">${u.status}</span></td>
              <td>${new Date(u.start_date).toLocaleDateString()}</td>
              <td><strong>${u.days_left} Days</strong></td>
              <td>
                <button class="btn-save" onclick="updateUser(${u.id})">Save</button>
                <button class="btn-pause" onclick="togglePause(${u.id})">${u.is_paused ? 'Resume' : 'Pause'}</button>
                <button class="btn-delete" onclick="deleteUser(${u.id})">Delete</button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function updateUser(id) {
      const user_name = document.getElementById(`name-${id}`).value;
      const phone_number = document.getElementById(`phone-${id}`).value;
      const amount_paid = document.getElementById(`amount-${id}`).value;
      const mpesa_code = document.getElementById(`code-${id}`).value;

      const res = await fetch('/api/admin/update-user', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'x-admin-token': adminToken 
        },
        body: JSON.stringify({ id, user_name, phone_number, amount_paid, mpesa_code })
      });

      const data = await res.json();
      if (data.success) {
        alert("Member details updated!");
        loadUsers();
      } else {
        alert("Error: " + (data.error || data.message));
      }
    }

    async function registerUser() {
      const name = document.getElementById('regName').value;
      const phone = document.getElementById('regPhone').value;
      const amount = document.getElementById('regAmount').value;
      const days = document.getElementById('regDays').value;

      if (!name || !phone) {
        alert("Please fill in both Name and Phone Number.");
        return;
      }

      const res = await fetch('/api/admin/register', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'x-admin-token': adminToken 
        },
        body: JSON.stringify({ name, phone, amount, days })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById('regName').value = '';
        document.getElementById('regPhone').value = '';
        loadUsers();
      } else {
        alert("Error: " + (data.error || data.message));
      }
    }

    async function togglePause(id) {
      await fetch('/api/admin/toggle-pause', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'x-admin-token': adminToken 
        },
        body: JSON.stringify({ id })
      });
      loadUsers();
    }

    async function deleteUser(id) {
      if (confirm("Are you sure you want to delete this user?")) {
        await fetch(`/api/admin/delete/${id}`, {
          method: 'DELETE',
          headers: { 'x-admin-token': adminToken }
        });
        loadUsers();
      }
    }

    loadUsers();
  </script>
</body>
</html>
