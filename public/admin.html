<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f8f9fa; }
    h2 { color: #212529; }
    table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 15px; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #dee2e6; }
    th { background-color: #28a745; color: white; text-transform: uppercase; font-size: 14px; }
    tr:hover { background-color: #f1f3f5; }
    .badge { padding: 4px 8px; border-radius: 4px; background: #d4edda; color: #155724; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Wi-Fi Access Admin Dashboard</h2>
  <table>
    <thead>
      <tr>
        <th>Phone Number</th>
        <th>M-Pesa Code</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Start Date</th>
        <th>Expiry Date</th>
      </tr>
    </thead>
    <tbody id="user-table">
      <tr><td colspan="6">Loading active users...</td></tr>
    </tbody>
  </table>

  <script>
    async function fetchUsers() {
      try {
        const response = await fetch('/api/users');
        const users = await response.json();
        const tbody = document.getElementById('user-table');
        tbody.innerHTML = '';

        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">No paid users found.</td></tr>';
          return;
        }

        users.forEach(u => {
          tbody.innerHTML += `
            <tr>
              <td>${u.phone_number}</td>
              <td><strong>${u.mpesa_code}</strong></td>
              <td>KES ${u.amount_paid}</td>
              <td><span class="badge">${u.status}</span></td>
              <td>${new Date(u.start_date).toLocaleString()}</td>
              <td>${new Date(u.expiry_date).toLocaleString()}</td>
            </tr>
          `;
        });
      } catch (err) {
        document.getElementById('user-table').innerHTML = '<tr><td colspan="6">Error loading data.</td></tr>';
      }
    }

    fetchUsers();
  </script>
</body>
</html>
