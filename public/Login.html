<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Wi-Fi Portal</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e2e8f0;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 380px;
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #1e293b;
      text-align: center;
      font-size: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: bold;
      color: #475569;
    }

    .form-group input {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: #333;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2b70ff;
    }

    .btn-login {
      background: #2b70ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #1a56db;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    #errorMsg {
      color: #dc3545;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
      display: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Admin Portal Login</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter admin username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter admin password" required>
      </div>
      <button type="submit" class="btn-login">Login to Dashboard</button>
      <div id="errorMsg">Invalid username or password</div>
    </form>
    <a href="/" class="back-link">← Back to Payment Page</a>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          // Save the token securely so admin.html accepts you
          localStorage.setItem('adminToken', data.token);
          // Redirect straight to your admin dashboard
          window.location.href = '/admin.html';
        } else {
          errorMsg.innerText = data.message || data.error || 'Invalid credentials';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        errorMsg.innerText = 'Network error. Please try again.';
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
