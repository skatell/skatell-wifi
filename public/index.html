<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROGERS' WIFI ACCESS PORTAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #007bff; /* Bright blue background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* Top Title Button/Banner */
        .btn-title {
            width: 100%;
            background-color: #e50914; /* Red banner */
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }

        /* Middle Navigation Row (Admin & User Login) */
        .nav-row {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .btn-admin {
            flex: 1;
            background-color: #00c853; /* Green */
            color: white;
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-user {
            flex: 1;
            background-color: #6200ee; /* Purple */
            color: white;
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Payment Page Button */
        .btn-payment {
            width: 100%;
            background-color: #ffc107; /* Yellow */
            color: #b71c1c; /* Dark red text */
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Help Box */
        .help-box {
            width: 100%;
            background-color: white;
            color: #333;
            text-align: center;
            padding: 20px 15px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .help-box p {
            font-size: 13px;
            margin-bottom: 5px;
            color: #444;
        }

        .help-box .phone-number {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            margin: 10px 0 15px 0;
            letter-spacing: 0.5px;
        }

        .help-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 8px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-call {
            background-color: #4285f4;
            color: white;
            padding: 8px 25px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        /* Bottom Branding Button */
        .btn-brand {
            width: 100%;
            background-color: #ff7043; /* Orange */
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Top Title Banner -->
        <div class="btn-title">ROGERS' WIFI ACCESS PORTAL</div>

        <!-- Admin & User Login Row -->
        <div class="nav-row">
            <a href="/admin" class="btn-admin">ADMIN LOGIN</a>
            <a href="/user" class="btn-user">USER LOGIN</a>
        </div>

        <!-- Payment Page Button (Points to your payment form route or page) -->
        <a href="/" class="btn-payment">PAYMENT PAGE</a>

        <!-- Help / Support Box -->
        <div class="help-box">
            <p>Need help or having trouble?</p>
            <p>Contact administrator via WhatsApp or Call:</p>
            <div class="phone-number">0143 149 490</div>
            <div class="help-actions">
                <a href="https://wa.me/254143149490" target="_blank" class="btn-whatsapp">WhatsApp</a>
                <a href="tel:0143149490" class="btn-call">Call</a>
            </div>
        </div>

        <!-- Bottom Brand Footer -->
        <div class="btn-brand">ROGERS</div>
    </div>

</body>
</html>
