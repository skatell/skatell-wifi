<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roggers' WiFi Access Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0073e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portal-container {
            width: 100%;
            max-width: 500px;
            background-color: #0073e6;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 20px;
        }

        .title-banner {
            width: 100%;
            background-color: #e60000;
            color: white;
            text-align: center;
            padding: 20px 10px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: underline;
            border-radius: 4px;
        }

        .nav-grid {
            width: 100%;
            display: flex;
            gap: 15px;
        }

        .btn-buy {
            flex: 1;
            background-color: #0073e6;
            color: white;
            border: none;
            padding: 25px 10px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }

        .btn-user {
            flex: 1;
            background-color: #6600cc;
            color: white;
            border: none;
            padding: 25px 10px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }

        .btn-buy:hover, .btn-user:hover {
            opacity: 0.9;
        }

        .admin-link-container {
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }

        .admin-link-container a {
            color: #ffffff;
            font-size: 12px;
            text-decoration: underline;
        }

        .admin-link-container a:hover {
            color: #e6e6e6;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="title-banner">
            Roggers' WiFi Access Portal
        </div>

        <div class="nav-grid">
            <!-- Points to your customer payment & registration form (login.html) -->
            <a href="/login" class="btn-buy" style="background-color: #00b33c;">Buy Wi-Fi / Pay</a>
            
            <!-- Points to your user status/connection portal (user.html) -->
            <a href="/user" class="btn-user">User Portal</a>
        </div>

        <!-- Discreet link for yourself as the network owner -->
        <div class="admin-link-container">
            <a href="/admin-login">Network Owner / Admin Login</a>
        </div>
    </div>

</body>
</html>
