<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roggers' WiFi Access Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0073e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portal-container {
            width: 100%;
            max-width: 500px;
            background-color: #0073e6;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 20px;
        }

        .title-banner {
            width: 100%;
            background-color: #e60000;
            color: white;
            text-align: center;
            padding: 20px 10px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: underline;
            border-radius: 4px;
        }

        .nav-grid {
            width: 100%;
            display: flex;
            gap: 15px;
        }

        .btn-admin {
            flex: 1;
            background-color: #00b33c;
            color: white;
            border: none;
            padding: 25px 10px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }

        .btn-user {
            flex: 1;
            background-color: #6600cc;
            color: white;
            border: none;
            padding: 25px 10px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }

        .btn-payment {
            width: 100%;
            background-color: #ffcc00;
            color: #cc0000;
            border: none;
            padding: 25px 10px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }

        .btn-admin:hover, .btn-user:hover, .btn-payment:hover {
            opacity: 0.9;
        }

        .help-box {
            width: 100%;
            background-color: white;
            color: #333;
            text-align: center;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .help-box p {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .help-box .phone-number {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
        }

        .help-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-call {
            background-color: #4285f4;
            color: white;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .footer-signature {
            width: 60%;
            background-color: #f07b3f;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        
        <div class="title-banner">
            ROGERS' WIFI ACCESS PORTAL
        </div>

        <div class="nav-grid">
            <a href="/admin-login" class="btn-admin">ADMIN LOGIN</a>
            <a href="/user" class="btn-user">USER LOGIN</a>
        </div>

        <a href="/login" class="btn-payment">PAYMENT PAGE</a>

        <div class="help-box">
            <p>Need help or having trouble?</p>
            <p>Contact administrator via WhatsApp or Call:</p>
            <div class="phone-number">0143 149 490</div>
            <div class="help-actions">
                <a href="https://wa.me/254143149490" target="_blank" class="btn-whatsapp">WhatsApp</a>
                <a href="tel:0143149490" class="btn-call">Call</a>
            </div>
        </div>

        <div class="footer-signature">
            ROGERS
        </div>

    </div>

</body>
</html>
