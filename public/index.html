<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Access Payment</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
    input { width: 92%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0056b3; }
    .msg { margin-top: 12px; font-weight: bold; font-size: 14px; }
    .error { color: #dc3545; }
    .portal-link { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: bold; font-size: 14px; }
    .portal-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Wi-Fi Access Payment</h2>
    <p style="color: #666; font-size: 14px;">Enter your details and M-Pesa transaction code to activate your internet.</p>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="phone" placeholder="Phone Number (e.g. 0712345678)">
    <input type="text" id="mpesaCode" placeholder="M-Pesa Transaction Code">
    <input type="number" id="amount" placeholder="Amount Paid (KES)">

    <button id="payBtn" onclick="submitPayment()">Verify & Connect</button>
    
    <div id="statusMsg" class="msg"></div>

    <!-- Step 3: Quick Link to User Portal -->
    <div>
      <a href="/user" class="portal-link">Already have an active plan? Click here to access your portal</a>
    </div>
  </div>

  <script>
    async function submitPayment() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const mpesaCode = document.getElementById('mpesaCode').value.trim();
      const amount = document.getElementById('amount').value.trim();
      const statusMsg = document.getElementById('statusMsg');
      const payBtn = document.getElementById('payBtn');

      statusMsg.className = 'msg';
      statusMsg.innerText = '';

      if (!name || !phone || !mpesaCode || !amount) {
        statusMsg.className = 'msg error';
        statusMsg.innerText = 'Please fill in all fields.';
        return;
      }

      payBtn.disabled = true;
      payBtn.innerText = 'Verifying...';

      try {
        // Step 2: Submit payment details to the backend API
        const res = await fetch('/api/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, mpesaCode, amount })
        });

        const data = await res.json();

        if (data.success) {
          alert(data.message);
          // Redirect straight to user portal with credentials in URL for auto-login
          window.location.href = `/user?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;
        } else {
          statusMsg.className = 'msg error';
          statusMsg.innerText = data.message || 'Payment verification failed.';
          payBtn.disabled = false;
          payBtn.innerText = 'Verify & Connect';
        }
      } catch (err) {
        statusMsg.className = 'msg error';
        statusMsg.innerText = 'Server error. Please try again later.';
        payBtn.disabled = false;
        payBtn.innerText = 'Verify & Connect';
      }
    }
  </script>
</body>
</html>
