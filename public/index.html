<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Access Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; }
    .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
    .instructions { background: #eef9f2; border: 1px solid #c3e6cb; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 14px; }
    input { width: 92%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #218838; }
    .msg { margin-top: 15px; font-weight: bold; }
    .success { color: #155724; }
    .error { color: #721c24; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Wi-Fi Access Portal</h2>
    
    <div class="instructions">
      <strong>Step 1:</strong> Send payment via M-Pesa Send Money to:<br>
      <strong style="color: #28a745; font-size: 16px;">0143149490</strong><br>
      <strong>Step 2:</strong> Enter your details below to unlock access.
    </div>

    <input type="text" id="userName" placeholder="Your Name (e.g. Lawi)">
    <input type="text" id="userPhone" placeholder="Your Phone Number (e.g. 0712345678)">
    <input type="number" id="userAmount" placeholder="Amount Paid KES (e.g. 200)" value="200">
    <input type="text" id="mpesaCode" placeholder="M-Pesa Transaction Code (e.g. SAB1234567)">

    <button onclick="verifyPayment()">Verify Payment & Access</button>

    <div id="statusMsg" class="msg"></div>

    <!-- Footer Section -->
    <footer style="margin-top: 25px; padding-top: 15px; border-top: 1px solid #ddd; font-size: 14px; color: #555;">
      <p style="margin: 0;">
        Reach out to Admin via WhatsApp / Calls: 
        <a href="https://wa.me/254115982405" target="_blank" style="color: #28a745; font-weight: bold; text-decoration: none;">
          0115 982 405
        </a>
      </p>
      <p style="margin: 5px 0 0 0; font-weight: bold; color: #333;">Admin: Roggers</p>
    </footer>
  </div>

  <script>
    async function verifyPayment() {
      const name = document.getElementById('userName').value;
      const phone = document.getElementById('userPhone').value;
      const amount = document.getElementById('userAmount').value;
      const mpesaCode = document.getElementById('mpesaCode').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!name || !phone || !mpesaCode || !amount) {
        statusMsg.className = 'msg error';
        statusMsg.innerText = 'Please fill in all fields.';
        return;
      }

      statusMsg.className = 'msg';
      statusMsg.innerText = 'Verifying payment...';

      try {
        const res = await fetch('/api/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, mpesaCode, amount })
        });

        const data = await res.json();
        if (data.success) {
          statusMsg.className = 'msg success';
          statusMsg.innerText = data.message;
        } else {
          statusMsg.className = 'msg error';
          statusMsg.innerText = data.message;
        }
      } catch (err) {
        statusMsg.className = 'msg error';
        statusMsg.innerText = 'Server error. Please try again.';
      }
    }
  </script>
</body>
</html>
